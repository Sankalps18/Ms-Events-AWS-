<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="header-copy">
                <a class="brand-text" href="/" aria-label="Ms. Events home">Ms. Events</a>
                <p class="eyebrow">Event RSVP Portal</p>
                <h1>Discover upcoming events</h1>
                <p>Browse the latest events, RSVP in seconds, and see live response counts.</p>
            </div>
        </header>

        <main class="events-grid" id="eventsGrid">
            <div class="loading">Loading events...</div>
        </main>
    </div>

    <div class="modal" id="eventModal">
        <button class="close-btn" onclick="closeModal()" aria-label="Close event details">&times;</button>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script src="utils.js"></script>
    <script src="events.js"></script>
    <script src="app.js"></script>
</body>
</html>
